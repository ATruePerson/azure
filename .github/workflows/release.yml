name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: x64
          - os: linux
            arch: arm64
          - os: linux
            arch: x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build --compile --target=bun-${{ matrix.os }}-${{ matrix.arch }} src/cli.ts --outfile azure-${{ matrix.os }}-${{ matrix.arch }}
      - run: tar -czf azure-${{ matrix.os }}-${{ matrix.arch }}.tar.gz azure-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: azure-${{ matrix.os }}-${{ matrix.arch }}
          path: azure-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
